spring.application.name=documind-backend
server.port=8080

# --- MongoDB (override with MONGODB_URI if needed) ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/documind}

# --- OpenAI via Spring AI (key comes from environment variable, never hard-code it) ---
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

# --- File upload limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- DocuMind settings ---
# Max characters of PDF text sent to the model (~4 chars per token, so 60000 is about 15k tokens)
documind.max-context-chars=60000
documind.max-question-length=1000
